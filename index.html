<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortuhr</title>
<style>
:root{
  --bg:#0c0d0f; --panel:#15171a; --off:#2a2d32; --on:#f4f1e8; --glow:rgba(244,241,232,.55); --ui:#9a9ca1; --uiOn:#f4f1e8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#e6e4df;--panel:#1b1c1f;--off:#33363b;--on:#fff;--glow:rgba(255,255,255,.6);--ui:#6b6d72;--uiOn:#111}
}
:root[data-theme="light"]{--bg:#e6e4df;--panel:#1b1c1f;--off:#33363b;--on:#fff;--glow:rgba(255,255,255,.6);--ui:#6b6d72;--uiOn:#111}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.frame{
  --s:min(92vw, 68vh, 620px);
  width:var(--s);aspect-ratio:1;background:var(--panel);border-radius:calc(var(--s)*.03);
  padding:calc(var(--s)*.075);position:relative;
  box-shadow:0 calc(var(--s)*.03) calc(var(--s)*.08) rgba(0,0,0,.35);
}
.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(10,1fr);
  font-size:calc(var(--s)*.056);font-weight:600}
.grid span{display:flex;align-items:center;justify-content:center;color:var(--off);
  transition:color .8s ease,text-shadow .8s ease}
.grid span.on{color:var(--on);text-shadow:0 0 .5em var(--glow)}
.dot{position:absolute;width:calc(var(--s)*.022);height:calc(var(--s)*.022);border-radius:50%;
  background:var(--off);transition:background .8s,box-shadow .8s}
.dot.on{background:var(--on);box-shadow:0 0 .8em var(--glow)}
.d0{left:calc(var(--s)*.03);top:calc(var(--s)*.03)}
.d1{right:calc(var(--s)*.03);top:calc(var(--s)*.03)}
.d2{right:calc(var(--s)*.03);bottom:calc(var(--s)*.03)}
.d3{left:calc(var(--s)*.03);bottom:calc(var(--s)*.03)}
.langs{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;max-width:92vw}
.langs button{font:inherit;font-size:.95rem;color:var(--ui);background:none;border:1px solid transparent;
  border-radius:2rem;padding:.45rem .9rem;cursor:pointer}
.langs button[aria-pressed="true"]{color:var(--uiOn);border-color:var(--ui)}
.langs button:focus-visible{outline:2px solid var(--uiOn);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.grid span,.dot{transition:none}}
</style>
</head>
<body>
<div class="frame" id="frame" title="Tippen: Hell/Dunkel">
  <div class="grid" id="grid"></div>
  <i class="dot d0"></i><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i>
</div>
<div class="langs" id="langs"></div>
<script>
const hours=(n)=>"h"+n;
const L={};

/* Muster nach den originalen QLOCKTWO-Frontplatten. Wort = [Zeile, Spalte, Länge] */

/* ---------- Deutsch ---------- */
L.de={name:"Deutsch",rows:["ESKISTAFÜNF","ZEHNZWANZIG","DREIVIERTEL","VORFUNKNACH","HALBAELFÜNF","EINSXAMZWEI","DREIPMJVIER","SECHSNLACHT","SIEBENZWÖLF","ZEHNEUNKUHR"],
W:{ES:[0,0,2],IST:[0,3,3],MF:[0,7,4],MZ:[1,0,4],ZWANZIG:[1,4,7],DREI:[2,0,4],VIERTEL:[2,4,7],VOR:[3,0,3],NACH:[3,7,4],HALB:[4,0,4],
 h1:[5,0,4],h1e:[5,0,3],h2:[5,7,4],h3:[6,0,4],h4:[6,7,4],h5:[4,7,4],h6:[7,0,5],h7:[8,0,6],h8:[7,7,4],h9:[9,3,4],h10:[9,0,4],h11:[4,5,3],h12:[8,6,5],UHR:[9,8,3]},
f(H,M){const q=M/5|0,w=["ES","IST"];let h=H%12||12;if(q>=5)h=h%12+1;
 const t=[[ "UHR"],["MF","NACH"],["MZ","NACH"],["VIERTEL","NACH"],["ZWANZIG","NACH"],["MF","VOR","HALB"],["HALB"],["MF","NACH","HALB"],["ZWANZIG","VOR"],["DREI","VIERTEL"],["MZ","VOR"],["MF","VOR"]][q];
 return w.concat(t,h===1&&q===0?"h1e":hours(h));}};

/* ---------- Schwäbisch ---------- */
L.sw={name:"Schwäbisch",rows:["ESKISCHFUNK","DREIVIERTLA","ZEHNBIEFÜNF","NACHGERTVOR","HALBXFÜNFEI","OISECHSELFE","ZWOIEACHTED","DREIEZWÖLFE","ZEHNEUNEUHL","SIEBNEVIERE"],
W:{ES:[0,0,2],ISCH:[0,3,4],DREI:[1,0,4],VIERTL:[1,4,6],MZ:[2,0,4],MF:[2,7,4],NACH:[3,0,4],VOR:[3,8,3],HALB:[4,0,4],
 h1:[5,0,3],h2:[6,0,5],h3:[7,0,5],h4:[9,6,5],h5:[4,5,4],h6:[5,2,5],h7:[9,0,6],h8:[6,5,5],h9:[8,3,5],h10:[8,0,5],h11:[5,7,4],h12:[7,5,6]},
f(H,M){const q=M/5|0;let h=H%12||12;if(q>=4)h=h%12+1;
 const t=[[],["MF","NACH"],["MZ","NACH"],["VIERTL","NACH"],["MZ","VOR","HALB"],["MF","VOR","HALB"],["HALB"],["MF","NACH","HALB"],["MZ","NACH","HALB"],["DREI","VIERTL"],["MZ","VOR"],["MF","VOR"]][q];
 return ["ES","ISCH"].concat(t,hours(h));}};

/* ---------- English ---------- */
L.en={name:"English",rows:["ITLISASAMPM","ACQUARTERDC","TWENTYFIVEX","HALFSTENFTO","PASTERUNINE","ONESIXTHREE","FOURFIVETWO","EIGHTELEVEN","SEVENTWELVE","TENSEOCLOCK"],
W:{IT:[0,0,2],IS:[0,3,2],A:[1,0,1],QUARTER:[1,2,7],TWENTY:[2,0,6],MF:[2,6,4],HALF:[3,0,4],MT:[3,5,3],TO:[3,9,2],PAST:[4,0,4],OCLOCK:[9,5,6],
 h1:[5,0,3],h2:[6,8,3],h3:[5,6,5],h4:[6,0,4],h5:[6,4,4],h6:[5,3,3],h7:[8,0,5],h8:[7,0,5],h9:[4,7,4],h10:[9,0,3],h11:[7,5,6],h12:[8,5,6]},
f(H,M){const q=M/5|0;let h=H%12||12;if(q>=7)h=h%12+1;
 const t=[["OCLOCK"],["MF","PAST"],["MT","PAST"],["A","QUARTER","PAST"],["TWENTY","PAST"],["TWENTY","MF","PAST"],["HALF","PAST"],["TWENTY","MF","TO"],["TWENTY","TO"],["A","QUARTER","TO"],["MT","TO"],["MF","TO"]][q];
 return ["IT","IS"].concat(t,hours(h));}};

/* ---------- Français ---------- */
L.fr={name:"Français",rows:["ILNESTODEUX","QUATRETROIS","NEUFUNESEPT","HUITSIXCINQ","MIDIXMINUIT","ONZERHEURES","MOINSOLEDIX","ETRQUARTPMD","VINGT-CINQU","ETSDEMIEPAM"],
W:{IL:[0,0,2],EST:[0,3,3],
 h1:[2,4,3],h2:[0,7,4],h3:[1,6,5],h4:[1,0,6],h5:[3,7,4],h6:[3,4,3],h7:[2,7,4],h8:[3,0,4],h9:[2,0,4],h10:[4,2,3],h11:[5,0,4],
 MIDI:[4,0,4],MINUIT:[4,5,6],HEURE:[5,5,5],HEURES:[5,5,6],
 MOINS:[6,0,5],LE:[6,6,2],MDIX:[6,8,3],ETQ:[7,0,2],QUART:[7,3,5],VINGT:[8,0,5],TIRET:[8,5,1],MCINQ:[8,6,4],ETD:[9,0,2],DEMIE:[9,3,5]},
f(H,M){const q=M/5|0;let h=(H+(q>=7?1:0))%24;
 const w=["IL","EST"];
 if(h===0)w.push("MINUIT");else if(h===12)w.push("MIDI");else{const n=h%12;w.push("h"+n,n===1?"HEURE":"HEURES");}
 const t=[[],["MCINQ"],["MDIX"],["ETQ","QUART"],["VINGT"],["VINGT","TIRET","MCINQ"],["ETD","DEMIE"],["MOINS","VINGT","TIRET","MCINQ"],["MOINS","VINGT"],["MOINS","LE","QUART"],["MOINS","MDIX"],["MOINS","MCINQ"]][q];
 return w.concat(t);}};

const grid=document.getElementById('grid'),dots=[...document.querySelectorAll('.dot')],bar=document.getElementById('langs');
const cells=[];for(let i=0;i<110;i++){const s=document.createElement('span');grid.appendChild(s);cells.push(s)}
let cur="de";
try{const s=localStorage.getItem('wortuhr-lang');if(s&&L[s])cur=s}catch(e){}

function setLang(k){
  cur=k;const lg=L[k];
  lg.rows.forEach((r,y)=>[...r].forEach((ch,x)=>cells[y*11+x].textContent=ch));
  document.documentElement.lang={de:"de",sw:"de",en:"en",fr:"fr"}[k];
  [...bar.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  try{localStorage.setItem('wortuhr-lang',k)}catch(e){}
  render();
}
Object.keys(L).forEach(k=>{const b=document.createElement('button');b.textContent=L[k].name;b.dataset.k=k;
  b.onclick=()=>setLang(k);bar.appendChild(b)});

function render(){
  const d=new Date(),lg=L[cur],on=new Set();
  lg.f(d.getHours(),d.getMinutes()).forEach(k=>{const p=lg.W[k];if(!p)return;const[r,c,l]=p;for(let i=0;i<l;i++)on.add(r*11+c+i)});
  cells.forEach((s,i)=>s.classList.toggle('on',on.has(i)));
  const e=d.getMinutes()%5;dots.forEach((x,i)=>x.classList.toggle('on',i<e));
}
setLang(cur);
setInterval(render,1000);
document.getElementById('frame').addEventListener('click',()=>{
  const r=document.documentElement;
  const dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0c0d0f';
  r.dataset.theme=dark?'light':'dark';
});
</script>
</body>
</html>
